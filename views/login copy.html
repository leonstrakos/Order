<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enter the Order</title>

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/home.css">
</head>

<body class="login-page">

  <section class="hero home login-hero">
    <video
      class="hero-video"
      autoplay
      muted
      loop
      playsinline
      poster="/images/image.jpg"
    >
      <source src="/images/video2.webm" type="video/webm">
    </video>

    <div class="login-overlay">
      <img class="login-seal" src="/images/logo just 4 stars.png" alt="Order seal">

      <h1>The Order of the Lion's Bell</h1>
      <p class="motto">Campana Sonat Omnibus</p>

        <form class="login-form" action="/login" method="POST">
        <input type="text" name="identity" placeholder="Name or Email" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Enter</button>
        </form>

      <p class="login-note">Access is reserved for those admitted.</p>
    </div>
  </section>

  <script src="/js/app.js"></script>
</body>
</html>
